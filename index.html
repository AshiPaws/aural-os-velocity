<!DOCTYPE html>
<html lang="en" class="h-full select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VELOCITY • AURAL-OS (Pixel 9)</title>

    <!-- Mobile Web App & PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#05020a">

    <!-- Embedded Web App Manifest for Instant Android PWA Installation -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"VELOCITY","short_name":"VELOCITY","description":"AURAL-OS Velocity HUD Speedometer","start_url":"./index.html","display":"standalone","orientation":"portrait","background_color":"#05020a","theme_color":"#05020a","icons":[{"src":"https://raw.githubusercontent.com/twitter/twemoji/master/assets/72x72/1f250.png","sizes":"72x72","type":"image/png"},{"src":"https://raw.githubusercontent.com/twitter/twemoji/master/assets/72x72/1f250.png","sizes":"192x192","type":"image/png"},{"src":"https://raw.githubusercontent.com/twitter/twemoji/master/assets/72x72/1f250.png","sizes":"512x512","type":"image/png"}]}'>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Orbitron & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@500;700;800;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        aural: {
                            bg: '#05020a',
                            bgDark: '#090412',
                            card: 'rgba(12, 6, 26, 0.75)',
                            purple: '#a855f7',
                            purpleBright: '#c084fc',
                            cyan: '#06b6d4',
                            cyanBright: '#22d3ee',
                            mint: '#10b981',
                            mintBright: '#34d399',
                            gold: '#f59e0b',
                            goldBright: '#fbbf24',
                            overload: '#ef4444'
                        }
                    },
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        inter: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --sat: env(safe-area-inset-top);
            --sab: env(safe-area-inset-bottom);
        }

        body {
            background-color: #05020a;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            padding-top: var(--sat);
            padding-bottom: var(--sab);
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        /* Glassmorphism Styling for Mobile OLED Panels */
        .frosted-glass {
            background: rgba(12, 6, 26, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(168, 85, 247, 0.25);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7);
            transition: all 0.3s ease;
        }

        .frosted-glass-sunlight {
            background: rgba(20, 10, 40, 0.95) !important;
            border: 2px solid rgba(34, 211, 238, 0.8) !important;
            color: #ffffff !important;
        }

        /* Glow effects */
        .text-glow-purple {
            text-shadow: 0 0 16px rgba(168, 85, 247, 0.85);
        }
        
        .text-glow-cyan {
            text-shadow: 0 0 16px rgba(6, 182, 212, 0.85);
        }

        .text-glow-gold {
            text-shadow: 0 0 14px rgba(245, 158, 11, 0.85);
        }

        .text-glow-mint {
            text-shadow: 0 0 14px rgba(16, 185, 129, 0.85);
        }

        .text-glow-red {
            text-shadow: 0 0 20px rgba(239, 68, 68, 1), 0 0 35px rgba(239, 68, 68, 0.8);
        }

        /* Pixel Camera Cutout Padding Helper */
        .pixel-top-notch {
            padding-top: max(26px, var(--sat));
        }

        /* Auralis Rune Pattern */
        .rune-bg {
            background-image: url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M60 10 L70 30 L60 50 L50 30 Z M60 50 L60 110 M30 60 L90 60 M20 40 L40 80 M100 40 L80 80' stroke='rgba(168, 85, 247, 0.035)' stroke-width='1.2' fill='none'/%3E%3Ccircle cx='60' cy='60' r='35' stroke='rgba(6, 182, 212, 0.025)' stroke-width='1' fill='none'/%3E%3C/svg%3E");
        }

        /* Visual Alert Strobe / Screen Overload Effects */
        .overload-mode {
            background-color: #1a0208 !important;
            box-shadow: inset 0 0 90px rgba(239, 68, 68, 0.6) !important;
        }

        /* Dynamic Glitch Animation for Overload Intensity */
        @keyframes glitch-intense {
            0% { transform: translate(0) skew(0deg); filter: drop-shadow(2px 0 #ef4444) drop-shadow(-2px 0 #06b6d4); }
            20% { transform: translate(-3px, 3px) skew(-3deg); filter: drop-shadow(-4px 2px #ef4444) drop-shadow(3px -2px #22d3ee); }
            40% { transform: translate(3px, -2px) skew(2deg); filter: drop-shadow(5px -1px #ef4444) drop-shadow(-4px 3px #06b6d4); }
            60% { transform: translate(-2px, -3px) skew(4deg); filter: drop-shadow(-3px -3px #ef4444) drop-shadow(2px 4px #22d3ee); }
            80% { transform: translate(3px, 2px) skew(-2deg); filter: drop-shadow(4px 3px #ef4444) drop-shadow(-3px -2px #06b6d4); }
            100% { transform: translate(0) skew(0deg); filter: drop-shadow(2px 0 #ef4444) drop-shadow(-2px 0 #06b6d4); }
        }

        .glitch-active {
            animation: glitch-intense 0.12s infinite;
        }

        /* Speedometer Dial Face Backdrop */
        .gauge-backdrop {
            background: radial-gradient(circle, rgba(18, 9, 38, 0.85) 0%, rgba(9, 4, 18, 0.95) 70%, rgba(5, 2, 10, 0.98) 100%);
            border: 2px solid rgba(168, 85, 247, 0.35);
            box-shadow: inset 0 0 45px rgba(0, 0, 0, 0.9), 0 0 30px rgba(168, 85, 247, 0.25);
        }

        /* Smooth touch feedback for Pixel screen taps */
        .touch-active:active {
            transform: scale(0.96);
            filter: brightness(1.2);
        }
    </style>
</head>
<body id="appBody" class="h-full w-full bg-aural-bg text-slate-100 flex flex-col justify-between overflow-hidden relative rune-bg transition-colors duration-300">

    <!-- Top Header Bar with Taller Padding and Right-Side 12-Hour Clock -->
    <header class="w-full px-4 pixel-top-notch z-40">
        <div id="headerBar" class="frosted-glass rounded-2xl px-5 py-4 flex items-center justify-between border border-aural-purple/30 gap-3">
            
            <!-- Left: Brand & VELOCITY Badge -->
            <div class="flex items-center gap-3 min-w-0">
                <div id="brandLogo" class="w-10 h-10 rounded-xl bg-aural-purple/20 border border-aural-gold/50 text-aural-gold flex items-center justify-center shrink-0">
                    <svg class="w-6 h-6 fill-current animate-pulse" viewBox="0 0 24 24">
                        <path d="M13 2L3 14h7v8l10-12h-7z"/>
                    </svg>
                </div>
                <div class="truncate">
                    <div class="flex items-center gap-2">
                        <span class="font-orbitron font-black text-base sm:text-lg tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-aural-gold via-aural-purpleBright to-aural-cyan">
                            VELOCITY
                        </span>
                    </div>
                </div>
            </div>

            <!-- Right: Larger 12-Hour System Clock & Sun Contrast Toggle -->
            <div class="flex items-center gap-4 shrink-0">
                <div class="text-right">
                    <div id="systemClock" class="font-orbitron font-black text-xl sm:text-2xl text-aural-cyan text-glow-cyan tracking-wider">12:00 AM</div>
                </div>
                <button id="contrastBtn" class="w-11 h-11 rounded-xl bg-black/40 border border-aural-cyan/30 text-aural-cyan flex items-center justify-center text-base active:scale-95 transition" title="Toggle Sun High-Contrast Mode">
                    <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">
                        <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1 z"/>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Center Main Display: Circular Gauge & Digital Speedometer -->
    <main class="flex-1 w-full mx-auto px-2 flex flex-col items-center justify-center relative z-30">
        
        <!-- Speedometer Canvas Container with Dial Face Background -->
        <div class="relative w-[320px] h-[320px] sm:w-[440px] sm:h-[440px] max-w-[92vw] max-h-[50vh] flex items-center justify-center my-auto rounded-full gauge-backdrop p-2">
            
            <!-- 60FPS Fluid Arc & Particle Canvas -->
            <canvas id="gaugeCanvas" width="500" height="500" class="w-full h-full relative z-10 drop-shadow-[0_0_35px_rgba(168,85,247,0.45)]"></canvas>

            <!-- Center Speed Text Overlay -->
            <div class="absolute inset-0 z-20 flex flex-col items-center justify-center text-center p-2 pointer-events-none">
                
                <!-- Unit Switcher Button with full reliable pointer-events-auto hitbox -->
                <button id="unitToggleBtn" class="pointer-events-auto mb-2 px-5 py-2.5 rounded-full text-xs sm:text-sm font-orbitron font-bold tracking-widest bg-aural-purple/30 border border-aural-purple/60 text-aural-cyan hover:bg-aural-purple/50 active:scale-95 transition shadow-[0_0_12px_rgba(6,182,212,0.3)] z-30 cursor-pointer">
                    <span id="currentUnitText">MPH</span> ⟳
                </button>

                <!-- Huge Digital Speed Display (Supports 0-99 in Overload) -->
                <div id="speedDisplay" class="font-orbitron font-black text-8xl sm:text-[9.5rem] tracking-tighter text-transparent bg-clip-text bg-gradient-to-b from-white via-slate-100 to-aural-purpleBright text-glow-purple leading-none my-0 scale-105 transition-all duration-300">
                    00
                </div>

                <!-- Sub-status / Dynamic Velocity Level -->
                <div class="flex items-center gap-1.5 mt-2">
                    <span id="statusBeacon" class="w-2.5 h-2.5 rounded-full bg-aural-cyan animate-pulse"></span>
                    <span id="speedSubtext" class="text-xs sm:text-sm font-mono text-aural-cyan tracking-widest uppercase font-bold">STATIONARY</span>
                </div>
            </div>
        </div>

        <!-- Overload Alert Banner (Appears from 60 to 99 MPH with smooth fade-in/out transition) -->
        <div id="speedLimitAlert" class="opacity-0 transition-opacity duration-300 pointer-events-none my-2 px-5 py-1.5 rounded-full bg-red-600 text-white font-orbitron text-[10px] sm:text-xs font-black tracking-widest border-2 border-white shadow-[0_0_25px_#ef4444] z-50 uppercase flex items-center justify-center gap-2 text-center">
            <span>MAXIMUM OVERLOAD</span>
        </div>

        <!-- Compact Secondary Compass Arc Bar -->
        <div id="compassBar" class="w-full max-w-sm frosted-glass rounded-xl px-4 py-2 flex items-center justify-between text-xs font-mono border border-aural-purple/20">
            <span class="text-slate-400 flex items-center gap-1">
                <svg class="w-3.5 h-3.5 fill-aural-cyan" viewBox="0 0 24 24"><path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/></svg> BEARING
            </span>
            <span id="compassHeadingFull" class="text-aural-cyan font-orbitron font-bold">000</span>
            <span id="latLngCompact" class="text-[10px] text-slate-400">00.00, 00.00</span>
        </div>
    </main>

    <!-- Bottom Ergonomic Thumb Zone: Telemetry Grid & Large Action Buttons -->
    <footer class="w-full px-4 pb-4 pt-1 z-40 flex flex-col gap-3">
        
        <!-- Ride Metrics Summary Grid -->
        <div class="grid grid-cols-4 gap-2">
            <div class="frosted-glass rounded-xl p-2.5 flex flex-col items-center justify-center text-center border border-aural-purple/20">
                <span class="text-[9px] font-mono text-slate-400 uppercase">TIME</span>
                <span id="rideTimerDisplay" class="font-orbitron font-bold text-sm sm:text-base text-white text-glow-purple">00:00</span>
            </div>
            <div class="frosted-glass rounded-xl p-2.5 flex flex-col items-center justify-center text-center border border-aural-purple/20">
                <span class="text-[9px] font-mono text-slate-400 uppercase">DIST (<span class="distUnitText">MI</span>)</span>
                <span id="distanceDisplay" class="font-orbitron font-bold text-sm sm:text-base text-aural-cyan text-glow-cyan">0.00</span>
            </div>
            <div class="frosted-glass rounded-xl p-2.5 flex flex-col items-center justify-center text-center border border-aural-purple/20">
                <span class="text-[9px] font-mono text-slate-400 uppercase">AVG (<span class="speedUnitText">MPH</span>)</span>
                <span id="avgSpeedDisplay" class="font-orbitron font-bold text-sm sm:text-base text-aural-mint text-glow-mint">0.0</span>
            </div>
            <div class="frosted-glass rounded-xl p-2.5 flex flex-col items-center justify-center text-center border border-aural-purple/20">
                <span class="text-[9px] font-mono text-slate-400 uppercase">MAX (<span class="speedUnitText">MPH</span>)</span>
                <span id="maxSpeedDisplay" class="font-orbitron font-bold text-sm sm:text-base text-aural-gold text-glow-gold">0.0</span>
            </div>
        </div>

        <!-- Touch Controls Bar -->
        <div class="grid grid-cols-3 gap-2">
            <button id="ridePlayBtn" class="py-3 rounded-2xl bg-gradient-to-r from-aural-mint to-emerald-600 font-orbitron font-bold text-xs text-black shadow-[0_0_15px_rgba(16,185,129,0.3)] touch-active flex flex-col items-center justify-center gap-0.5">
                <span id="ridePlayIcon">▶</span>
                <span id="ridePlayText" class="text-[9px]">START</span>
            </button>

            <button id="modeToggleBtn" class="py-3 rounded-2xl bg-aural-purple/20 border border-aural-purple/40 font-orbitron font-bold text-xs text-aural-purpleBright touch-active flex flex-col items-center justify-center gap-0.5">
                <span id="modeIcon">🎯</span>
                <span id="modeText" class="text-[9px]">GPS SENSOR</span>
            </button>

            <button id="resetStatsBtn" class="py-3 rounded-2xl bg-black/50 border border-red-500/30 font-orbitron font-bold text-xs text-red-400 touch-active flex flex-col items-center justify-center gap-0.5">
                <span>↺</span>
                <span class="text-[9px]">RESET</span>
            </button>
        </div>

        <!-- Touch Simulator Throttle Bar (Max 99 MPH for Testing Overload & Glitch) -->
        <div id="simThrottleContainer" class="hidden w-full frosted-glass rounded-2xl p-3 border border-aural-gold/40 flex items-center gap-3">
            <span class="text-[10px] font-mono text-aural-gold font-bold flex items-center gap-1 shrink-0">
                🎮 SIM (0-99 MPH)
            </span>
            <input id="simSpeedSlider" type="range" min="0" max="99" value="0" step="0.5" class="flex-1 accent-aural-gold h-2">
            <button id="instantBrakeBtn" class="px-3.5 py-1.5 rounded-xl bg-red-500/30 border border-red-500/50 font-orbitron text-[10px] font-bold text-red-300 touch-active shrink-0">
                BRAKE
            </button>
        </div>
    </footer>

    <script>
        const KMH_TO_MPH = 0.621371;
        // Gauge maximum calibrated to 25 MPH (~40.23 KM/H). Overload goes 26-99 MPH.
        const MAX_GAUGE_SPEED_MPH = 25;
        const MAX_GAUGE_SPEED_KMH = MAX_GAUGE_SPEED_MPH / KMH_TO_MPH;

        const state = {
            unit: 'MPH',
            mode: 'GPS',
            currentSpeedKmh: 0,
            targetSpeedKmh: 0,
            maxSpeedKmh: 0,
            isOverloaded: false,
            isMaximumOverloaded: false,
            overloadFactor: 0,
            distanceMeters: 0,
            timerRunning: false,
            timerElapsedSeconds: 0,
            timerInterval: null,
            headingDegrees: 0,
            isGpsLocked: false,
            sunlightMode: false,
            wakeLock: null
        };

        const appBody = document.getElementById('appBody');
        const headerBar = document.getElementById('headerBar');
        const contrastBtn = document.getElementById('contrastBtn');
        const systemClock = document.getElementById('systemClock');
        const compassHeadingFull = document.getElementById('compassHeadingFull');
        const latLngCompact = document.getElementById('latLngCompact');

        const speedLimitAlert = document.getElementById('speedLimitAlert');
        const gaugeCanvas = document.getElementById('gaugeCanvas');
        const ctx = gaugeCanvas ? gaugeCanvas.getContext('2d') : null;

        const unitToggleBtn = document.getElementById('unitToggleBtn');
        const currentUnitText = document.getElementById('currentUnitText');
        const speedDisplay = document.getElementById('speedDisplay');
        const speedSubtext = document.getElementById('speedSubtext');
        const statusBeacon = document.getElementById('statusBeacon');

        const rideTimerDisplay = document.getElementById('rideTimerDisplay');
        const distanceDisplay = document.getElementById('distanceDisplay');
        const avgSpeedDisplay = document.getElementById('avgSpeedDisplay');
        const maxSpeedDisplay = document.getElementById('maxSpeedDisplay');

        const ridePlayBtn = document.getElementById('ridePlayBtn');
        const ridePlayIcon = document.getElementById('ridePlayIcon');
        const ridePlayText = document.getElementById('ridePlayText');

        const modeToggleBtn = document.getElementById('modeToggleBtn');
        const modeIcon = document.getElementById('modeIcon');
        const modeText = document.getElementById('modeText');

        const resetStatsBtn = document.getElementById('resetStatsBtn');
        const simThrottleContainer = document.getElementById('simThrottleContainer');
        const simSpeedSlider = document.getElementById('simSpeedSlider');
        const instantBrakeBtn = document.getElementById('instantBrakeBtn');

        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    state.wakeLock = await navigator.wakeLock.request('screen');
                } catch (err) {
                    console.warn('Wake Lock error:', err);
                }
            }
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && state.timerRunning) {
                requestWakeLock();
            }
        });

        function startTimer() {
            if (state.timerInterval) clearInterval(state.timerInterval);
            state.timerInterval = setInterval(() => {
                if (state.timerRunning) {
                    state.timerElapsedSeconds++;
                    updateTimerUI();

                    if (state.currentSpeedKmh > 0) {
                        const distSecMeters = (state.currentSpeedKmh * 1000) / 3600;
                        state.distanceMeters += distSecMeters;
                        updateDistanceUI();
                    }
                }
            }, 1000);
        }

        function updateTimerUI() {
            const mins = Math.floor(state.timerElapsedSeconds / 60).toString().padStart(2, '0');
            const secs = (state.timerElapsedSeconds % 60).toString().padStart(2, '0');
            if (rideTimerDisplay) rideTimerDisplay.innerText = `${mins}:${secs}`;
        }

        if (ridePlayBtn) {
            ridePlayBtn.addEventListener('click', () => {
                state.timerRunning = !state.timerRunning;
                if (state.timerRunning) {
                    if (ridePlayIcon) ridePlayIcon.innerText = '❚❚';
                    if (ridePlayText) ridePlayText.innerText = 'PAUSE';
                    ridePlayBtn.className = 'py-3 rounded-2xl bg-amber-500 font-orbitron font-bold text-xs text-black shadow-[0_0_15px_rgba(245,158,11,0.4)] touch-active flex flex-col items-center justify-center gap-0.5';
                    requestWakeLock();
                } else {
                    if (ridePlayIcon) ridePlayIcon.innerText = '▶';
                    if (ridePlayText) ridePlayText.innerText = 'RESUME';
                    ridePlayBtn.className = 'py-3 rounded-2xl bg-gradient-to-r from-aural-mint to-emerald-600 font-orbitron font-bold text-xs text-black shadow-[0_0_15px_rgba(16,185,129,0.3)] touch-active flex flex-col items-center justify-center gap-0.5';
                }
            });
        }

        if (resetStatsBtn) {
            resetStatsBtn.addEventListener('click', () => {
                state.timerElapsedSeconds = 0;
                state.distanceMeters = 0;
                state.maxSpeedKmh = 0;
                updateTimerUI();
                updateDistanceUI();
                updateMaxSpeedUI();
            });
        }

        function getSpeedInActiveUnit(speedKmh) {
            return state.unit === 'MPH' ? speedKmh * KMH_TO_MPH : speedKmh;
        }

        function updateDistanceUI() {
            const distInKm = state.distanceMeters / 1000;
            const distInUnit = state.unit === 'MPH' ? distInKm * KMH_TO_MPH : distInKm;
            if (distanceDisplay) distanceDisplay.innerText = distInUnit.toFixed(2);

            if (state.timerElapsedSeconds > 0) {
                const avgKmh = (distInKm / (state.timerElapsedSeconds / 3600));
                const avgInUnit = state.unit === 'MPH' ? avgKmh * KMH_TO_MPH : avgKmh;
                if (avgSpeedDisplay) avgSpeedDisplay.innerText = avgInUnit.toFixed(1);
            }
        }

        function updateMaxSpeedUI() {
            const maxInUnit = getSpeedInActiveUnit(state.maxSpeedKmh);
            if (maxSpeedDisplay) maxSpeedDisplay.innerText = maxInUnit.toFixed(1);
        }

        function setUnit(newUnit) {
            state.unit = newUnit;
            if (currentUnitText) currentUnitText.innerText = newUnit;
            
            document.querySelectorAll('.distUnitText').forEach(el => el.innerText = newUnit === 'MPH' ? 'MI' : 'KM');
            document.querySelectorAll('.speedUnitText').forEach(el => el.innerText = newUnit);

            updateSpeedUI();
            updateDistanceUI();
            updateMaxSpeedUI();
        }

        if (unitToggleBtn) {
            unitToggleBtn.addEventListener('click', () => {
                setUnit(state.unit === 'MPH' ? 'KM/H' : 'MPH');
            });
        }

        /* Particles Array for Lunacurrent Energy Animation */
        const particles = [];
        for (let i = 0; i < 60; i++) {
            particles.push({
                angle: Math.random() * Math.PI * 2,
                speed: 0.004 + Math.random() * 0.012,
                radiusOffset: (Math.random() - 0.5) * 28,
                size: 1.2 + Math.random() * 2.5,
                alpha: 0.2 + Math.random() * 0.8
            });
        }

        let animationFrame = 0;

        function drawGauge() {
            if (!ctx || !gaugeCanvas) return;
            animationFrame++;
            ctx.clearRect(0, 0, gaugeCanvas.width, gaugeCanvas.height);

            const centerX = gaugeCanvas.width / 2;
            const centerY = gaugeCanvas.height / 2;
            const radius = 195;

            const startAngle = Math.PI * 0.75;
            const endAngle = Math.PI * 2.25;
            const totalArc = endAngle - startAngle;

            const speedRatio = Math.min(1, Math.max(0, state.currentSpeedKmh / MAX_GAUGE_SPEED_KMH));
            const currentArcAngle = startAngle + (totalArc * speedRatio);

            const targetOverload = (state.isOverloaded || state.isMaximumOverloaded) ? 1 : 0;
            state.overloadFactor += (targetOverload - state.overloadFactor) * 0.08;

            // 0. Render Canvas Speedometer Dial Background
            ctx.save();
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius + 22, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(8, 4, 16, 0.75)';
            ctx.fill();
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = (state.isOverloaded || state.isMaximumOverloaded) ? 'rgba(239, 68, 68, 0.4)' : 'rgba(168, 85, 247, 0.25)';
            ctx.stroke();

            // Inner Concentric Speedometer Grid Line
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius - 36, startAngle, endAngle);
            ctx.strokeStyle = 'rgba(6, 182, 212, 0.15)';
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 4]);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.restore();

            // 1. Futuristic Tick Marks & Speed Numbers around Dial Rim (0 - 25 MPH)
            const totalTicks = 25;
            for (let i = 0; i <= totalTicks; i++) {
                const tickAngle = startAngle + (totalArc * (i / totalTicks));
                const isMajor = i % 5 === 0;
                const innerR = radius - (isMajor ? 28 : 20);
                const outerR = radius - 14;

                const x1 = centerX + Math.cos(tickAngle) * innerR;
                const y1 = centerY + Math.sin(tickAngle) * innerR;
                const x2 = centerX + Math.cos(tickAngle) * outerR;
                const y2 = centerY + Math.sin(tickAngle) * outerR;

                ctx.save();
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.lineWidth = isMajor ? 3 : 1.2;

                if (state.isOverloaded || state.isMaximumOverloaded) {
                    ctx.strokeStyle = 'rgba(239, 68, 68, 0.9)';
                } else if (tickAngle <= currentArcAngle) {
                    ctx.strokeStyle = 'rgba(34, 211, 238, 0.85)';
                } else {
                    ctx.strokeStyle = 'rgba(168, 85, 247, 0.2)';
                }

                ctx.stroke();

                if (isMajor) {
                    const textR = radius - 44;
                    const tx = centerX + Math.cos(tickAngle) * textR;
                    const ty = centerY + Math.sin(tickAngle) * textR + 4;
                    const mphLabel = Math.round((i / totalTicks) * MAX_GAUGE_SPEED_MPH);

                    ctx.font = 'bold 12px Orbitron, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillStyle = tickAngle <= currentArcAngle 
                        ? ((state.isOverloaded || state.isMaximumOverloaded) ? '#f87171' : '#22d3ee') 
                        : 'rgba(148, 163, 184, 0.6)';
                    ctx.fillText(mphLabel.toString(), tx, ty);
                }

                ctx.restore();
            }

            // 2. Backing Track Arc
            ctx.save();
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, startAngle, endAngle);
            ctx.lineWidth = 22;
            ctx.strokeStyle = (state.isOverloaded || state.isMaximumOverloaded)
                ? 'rgba(239, 68, 68, 0.25)' 
                : (state.sunlightMode ? 'rgba(255, 255, 255, 0.2)' : 'rgba(168, 85, 247, 0.15)');
            ctx.lineCap = 'round';
            ctx.stroke();
            ctx.restore();

            // 3. Active Animated Lunacurrent Arc with Faded Edges
            if (speedRatio > 0.001) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, startAngle, currentArcAngle);
                ctx.lineWidth = 22;
                ctx.lineCap = 'round';

                if (state.isOverloaded || state.isMaximumOverloaded) {
                    ctx.strokeStyle = '#ef4444';
                    ctx.shadowColor = '#ef4444';
                    ctx.shadowBlur = 25 + Math.sin(animationFrame * 0.2) * 10;
                } else {
                    const arcRatio = (currentArcAngle - startAngle) / (Math.PI * 2);
                    const gradient = ctx.createConicGradient(startAngle, centerX, centerY);

                    gradient.addColorStop(0, 'rgba(168, 85, 247, 0.0)');
                    gradient.addColorStop(Math.min(0.15, arcRatio * 0.2), 'rgba(168, 85, 247, 0.85)');
                    gradient.addColorStop(Math.min(0.4, arcRatio * 0.5), 'rgba(6, 182, 212, 0.95)');
                    gradient.addColorStop(Math.min(0.7, arcRatio * 0.8), 'rgba(10, 185, 129, 0.95)');
                    gradient.addColorStop(Math.max(0, arcRatio - 0.05), 'rgba(192, 132, 252, 0.85)');
                    gradient.addColorStop(arcRatio, 'rgba(192, 132, 252, 0.0)');

                    ctx.strokeStyle = gradient;
                    ctx.shadowColor = speedRatio > 0.6 ? '#22d3ee' : '#a855f7';
                    ctx.shadowBlur = 18 + Math.sin(animationFrame * 0.08) * 8;
                }

                ctx.stroke();
                ctx.restore();

                // Glowing Tip Indicator Dot
                const tipX = centerX + Math.cos(currentArcAngle) * radius;
                const tipY = centerY + Math.sin(currentArcAngle) * radius;
                ctx.save();
                ctx.beginPath();
                ctx.arc(tipX, tipY, 13, 0, Math.PI * 2);
                ctx.fillStyle = state.overloadFactor > 0.5 ? '#fef08a' : '#ffffff';
                ctx.shadowColor = state.overloadFactor > 0.5 ? '#ef4444' : '#22d3ee';
                ctx.shadowBlur = 25;
                ctx.fill();
                ctx.restore();
            }

            // 4. Orbiting Energy Particles
            const speedMph = state.currentSpeedKmh * KMH_TO_MPH;
            let particleFadeFactor = 0;
            if (speedMph >= 1 && speedMph <= 35) {
                particleFadeFactor = (speedMph - 1) / 34;
            } else if (speedMph > 35) {
                particleFadeFactor = 1;
            }

            if (particleFadeFactor > 0.001) {
                const speedMultiplier = 0.2 + (Math.min(99, speedMph) / 20) * 8.5;

                particles.forEach(p => {
                    p.angle += p.speed * speedMultiplier;
                    if (p.angle > Math.PI * 2) p.angle -= Math.PI * 2;

                    const pRadius = radius + p.radiusOffset;
                    const px = centerX + Math.cos(p.angle) * pRadius;
                    const py = centerY + Math.sin(p.angle) * pRadius;

                    const activeAlpha = p.alpha * particleFadeFactor;

                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(px, py, p.size, 0, Math.PI * 2);
                    
                    if (state.overloadFactor > 0.1) {
                        ctx.fillStyle = `rgba(239, 68, 68, ${activeAlpha})`;
                        ctx.shadowColor = '#ef4444';
                    } else {
                        ctx.fillStyle = speedRatio > 0.5 ? `rgba(34, 211, 238, ${activeAlpha})` : `rgba(192, 132, 252, ${activeAlpha})`;
                        ctx.shadowColor = '#06b6d4';
                    }

                    ctx.shadowBlur = 6 * particleFadeFactor;
                    ctx.fill();
                    ctx.restore();
                });
            }

            updateSpeedUI();
            requestAnimationFrame(drawGauge);
        }

        function startGpsTracking() {
            if (!('geolocation' in navigator)) return;

            navigator.geolocation.watchPosition(
                (pos) => {
                    const c = pos.coords;
                    state.isGpsLocked = true;
                    if (latLngCompact) latLngCompact.innerText = `${c.latitude.toFixed(2)}, ${c.longitude.toFixed(2)}`;

                    if (c.speed !== null && c.speed !== undefined && !isNaN(c.speed)) {
                        const kmh = c.speed * 3.6;
                        if (state.mode === 'GPS') {
                            state.currentSpeedKmh = kmh;
                        }
                    }

                    if (c.heading !== null && c.heading !== undefined && !isNaN(c.heading)) {
                        updateHeading(c.heading);
                    }
                },
                (err) => {
                    console.warn('GPS Error:', err.message);
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 1000 }
            );
        }

        function updateHeading(deg) {
            const norm = (Math.round(deg) + 360) % 360;
            state.headingDegrees = norm;
            if (compassHeadingFull) compassHeadingFull.innerText = norm.toString().padStart(3, '0');
        }

        function updateSpeedUI() {
            if (state.mode === 'SIM') {
                state.currentSpeedKmh += (state.targetSpeedKmh - state.currentSpeedKmh) * 0.08;
            }

            const activeSpeed = getSpeedInActiveUnit(state.currentSpeedKmh);
            const speedMph = state.currentSpeedKmh * KMH_TO_MPH;

            const displaySpeedVal = Math.min(99, Math.round(activeSpeed));
            if (speedDisplay) speedDisplay.innerText = displaySpeedVal.toString().padStart(2, '0');

            if (state.currentSpeedKmh > state.maxSpeedKmh) {
                state.maxSpeedKmh = state.currentSpeedKmh;
                updateMaxSpeedUI();
            }

            // OVERLOAD active from 26 to 99 MPH
            if (speedMph >= 26) {
                if (!state.isOverloaded) {
                    state.isOverloaded = true;
                    triggerVisualOverloadMode(true);
                }
            } else {
                if (state.isOverloaded) {
                    state.isOverloaded = false;
                    triggerVisualOverloadMode(false);
                }
            }

            // MAXIMUM OVERLOAD badge appears from 60 to 99 MPH with fade transition
            if (speedMph >= 60) {
                if (!state.isMaximumOverloaded) {
                    state.isMaximumOverloaded = true;
                    if (speedLimitAlert) {
                        speedLimitAlert.classList.remove('opacity-0');
                        speedLimitAlert.classList.add('opacity-100');
                    }
                }
            } else {
                if (state.isMaximumOverloaded) {
                    state.isMaximumOverloaded = false;
                    if (speedLimitAlert) {
                        speedLimitAlert.classList.remove('opacity-100');
                        speedLimitAlert.classList.add('opacity-0');
                    }
                }
            }

            if (state.isOverloaded) {
                const overloadAmount = Math.min(1, (speedMph - 26) / 73);
                if (speedDisplay) {
                    speedDisplay.classList.add('glitch-active');
                    speedDisplay.style.transform = `scale(${1.05 + overloadAmount * 0.25}) skew(${(Math.random() - 0.5) * overloadAmount * 18}deg)`;
                }
            } else {
                if (speedDisplay) {
                    speedDisplay.classList.remove('glitch-active');
                    speedDisplay.style.transform = 'scale(1.05)';
                }
            }

            // Subtext update logic
            if (speedSubtext) {
                if (state.isOverloaded) {
                    speedSubtext.innerText = 'OVERLOAD';
                    speedSubtext.className = 'text-xs sm:text-sm font-orbitron text-red-500 tracking-widest uppercase font-black animate-pulse';
                    if (statusBeacon) statusBeacon.className = 'w-2.5 h-2.5 rounded-full bg-red-500 animate-ping';
                } else if (activeSpeed < 1) {
                    speedSubtext.innerText = 'STATIONARY';
                    speedSubtext.className = 'text-xs sm:text-sm font-mono text-aural-cyan tracking-widest uppercase font-bold';
                    if (statusBeacon) statusBeacon.className = 'w-2.5 h-2.5 rounded-full bg-aural-cyan animate-pulse';
                } else if (activeSpeed < 10) {
                    speedSubtext.innerText = 'LOW VELOCITY';
                    speedSubtext.className = 'text-xs sm:text-sm font-mono text-aural-mint tracking-widest uppercase font-bold';
                    if (statusBeacon) statusBeacon.className = 'w-2.5 h-2.5 rounded-full bg-aural-mint animate-pulse';
                } else if (activeSpeed < 20) {
                    speedSubtext.innerText = 'OPTIMAL VECTOR';
                    speedSubtext.className = 'text-xs sm:text-sm font-mono text-aural-gold tracking-widest uppercase font-bold';
                    if (statusBeacon) statusBeacon.className = 'w-2.5 h-2.5 rounded-full bg-aural-gold animate-pulse';
                } else {
                    speedSubtext.innerText = 'MAX VELOCITY';
                    speedSubtext.className = 'text-xs sm:text-sm font-mono text-aural-purpleBright tracking-widest uppercase font-bold';
                    if (statusBeacon) statusBeacon.className = 'w-2.5 h-2.5 rounded-full bg-aural-purpleBright animate-pulse';
                }
            }
        }

        function triggerVisualOverloadMode(enable) {
            if (enable) {
                if (appBody) appBody.classList.add('overload-mode');
                if (speedDisplay) {
                    speedDisplay.className = 'font-orbitron font-black text-8xl sm:text-[9.5rem] tracking-tighter text-red-500 text-glow-red leading-none my-0 transition-all duration-300';
                }
            } else {
                if (appBody) appBody.classList.remove('overload-mode');
                if (speedDisplay) {
                    speedDisplay.className = 'font-orbitron font-black text-8xl sm:text-[9.5rem] tracking-tighter text-transparent bg-clip-text bg-gradient-to-b from-white via-slate-100 to-aural-purpleBright text-glow-purple leading-none my-0 scale-105 transition-all duration-300';
                }
            }
        }

        // GPS Sensor / Simulator Mode Toggle Handler
        if (modeToggleBtn) {
            modeToggleBtn.addEventListener('click', () => {
                if (state.mode === 'GPS') {
                    state.mode = 'SIM';
                    if (modeIcon) modeIcon.innerText = '🎮';
                    if (modeText) modeText.innerText = 'SIMULATOR';
                    modeToggleBtn.className = 'py-3 rounded-2xl bg-aural-gold/20 border border-aural-gold/50 font-orbitron font-bold text-xs text-aural-goldBright touch-active flex flex-col items-center justify-center gap-0.5 shadow-[0_0_12px_rgba(245,158,11,0.25)]';
                    if (simThrottleContainer) simThrottleContainer.classList.remove('hidden');
                } else {
                    state.mode = 'GPS';
                    state.targetSpeedKmh = 0;
                    if (simSpeedSlider) simSpeedSlider.value = 0;
                    if (modeIcon) modeIcon.innerText = '🎯';
                    if (modeText) modeText.innerText = 'GPS SENSOR';
                    modeToggleBtn.className = 'py-3 rounded-2xl bg-aural-purple/20 border border-aural-purple/40 font-orbitron font-bold text-xs text-aural-purpleBright touch-active flex flex-col items-center justify-center gap-0.5';
                    if (simThrottleContainer) simThrottleContainer.classList.add('hidden');
                }
            });
        }

        // Simulator Speed Slider Listener (Target Speed in MPH -> KM/H)
        if (simSpeedSlider) {
            simSpeedSlider.addEventListener('input', (e) => {
                const targetMph = parseFloat(e.target.value);
                state.targetSpeedKmh = targetMph / KMH_TO_MPH;
            });
        }

        // Instant Brake Button Listener
        if (instantBrakeBtn) {
            instantBrakeBtn.addEventListener('click', () => {
                state.targetSpeedKmh = 0;
                if (simSpeedSlider) simSpeedSlider.value = 0;
            });
        }

        // Sun / Sunlight High-Contrast Toggle Listener
        if (contrastBtn) {
            contrastBtn.addEventListener('click', () => {
                state.sunlightMode = !state.sunlightMode;
                if (state.sunlightMode) {
                    if (headerBar) headerBar.classList.add('frosted-glass-sunlight');
                    if (contrastBtn) contrastBtn.className = 'w-11 h-11 rounded-xl bg-aural-cyan text-black flex items-center justify-center text-base font-bold active:scale-95 transition shadow-[0_0_12px_#22d3ee]';
                } else {
                    if (headerBar) headerBar.classList.remove('frosted-glass-sunlight');
                    if (contrastBtn) contrastBtn.className = 'w-11 h-11 rounded-xl bg-black/40 border border-aural-cyan/30 text-aural-cyan flex items-center justify-center text-base active:scale-95 transition';
                }
            });
        }

        // Real-Time 12-Hour Clock Update Loop (No Seconds)
        setInterval(() => {
            if (systemClock) {
                const now = new Date();
                let hours = now.getHours();
                const minutes = now.getMinutes().toString().padStart(2, '0');
                const ampm = hours >= 12 ? 'PM' : 'AM';
                hours = hours % 12;
                hours = hours ? hours : 12;
                const formattedHours = hours.toString().padStart(2, '0');
                systemClock.innerText = `${formattedHours}:${minutes} ${ampm}`;
            }
        }, 1000);

        // Application Startup Initialization
        window.onload = function() {
            startGpsTracking();
            startTimer();
            drawGauge();
        };
    </script>
</body>
</html>
